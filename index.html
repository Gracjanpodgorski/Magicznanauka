/* Multi-family edition */
.toast{pointer-events:none}
.public-chip{font-weight:900;color:#4c40a9;background:#eee9ff;border-radius:22px;padding:8px 13px;font-size:12px}

.pin-input{letter-spacing:.3em;font-size:27px!important;text-align:center;font-weight:900}
.admin-entrance{display:inline-flex;margin-top:20px;opacity:.65;font-size:12px}
.cloud-status{position:fixed;right:15px;bottom:17px;border-radius:100px;padding:8px 12px;background:#fff;box-shadow:0 8px 40px #25214a24;font-size:12px;font-weight:900;color:#5c50bd;z-index:35;pointer-events:none}

/* Magiczna Kraina Nauki – WIELKA PRZYGODA */
.topic-choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:9px;margin:14px 0 18px}
.topic-choice label{display:flex;align-items:center;gap:9px;padding:13px;border:1px solid #e4e4f5;background:#fff;border-radius:13px;cursor:pointer;font-size:13px;font-weight:800}
.topic-choice label:has(input:checked){background:#f0edff;border-color:#8d7ae9}
.topic-choice input{accent-color:#7355de;width:19px;height:19px;flex:none}
.exam-preset{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.exam-preset button{padding:9px 13px;border:1px solid #ddd7f4;border-radius:24px;background:#f9f8ff;font-size:12px;font-weight:900;color:#5741af}
.exam-preset button:hover{background:#ebe7ff}
.fun-hero{background:linear-gradient(115deg,#6d51dc,#ae78e3);padding:27px;border-radius:22px;color:#fff;margin-bottom:18px}
.fun-hero h1{font-size:clamp(25px,4vw,39px);margin:5px 0 7px;color:#fff}
.fun-hero p{color:#f7f1ff;margin:0;font-size:14px}
.game-board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;max-width:700px;margin:18px auto}
.game-cell{min-height:63px;aspect-ratio:1.26;background:#f2efff;border:2px solid #e6dfff;border-radius:14px;display:grid;place-items:center;font-weight:900;color:#7964c6;position:relative;font-size:15px}
.game-cell:nth-child(6n+3){background:#e5f8f4;border-color:#c8eee3}
.game-cell:nth-child(7n+4){background:#fff1dd;border-color:#ffead0}
.game-cell.reached{background:#dbf7e8;border-color:#4fc9a3}
.game-cell.current{background:#7558dc;color:white;border-color:#5738cf;box-shadow:0 6px 18px #7558dc55}
.game-cell span{font-size:25px}
.game-pill{display:inline-flex;gap:8px;background:#f2effe;color:#5742bb;padding:9px 14px;border-radius:35px;font-weight:900;font-size:13px}
.fun-stats{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0 16px}
.memory-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:750px;margin:15px auto}
.memory-card{border:2px solid #ded8fb;background:#7457d9;color:#fff;border-radius:17px;min-height:104px;display:grid;place-items:center;text-align:center;padding:9px;font-weight:900;font-size:clamp(12px,2vw,22px);word-break:break-word}
.memory-card.open{background:white;color:#3d3674;border-color:#7460d8}
.memory-card.matched{background:#e0f7e9;color:#1d7f5e;border-color:#7bd8ac}
.shop-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.shop-product{padding:17px 8px;text-align:center;background:#fff;border:2px solid #eee9f7;border-radius:17px;display:grid;gap:5px;justify-items:center}

/* ===== 4.3 KOLOROWA ODSŁONA ===== */
:root{
  --ink:#2f3560;
  --muted:#68759a;
  --primary:#7a5cf3;
  --purple:#7a5cf3;
  --light:#f3efff;
  --mint:#27bea2;
  --peach:#ffd888;
  --sky:#79c8ff;
  --rose:#ff8fb3;
  --sun:#ffca60;
  --border:#e9e7f7;
  --shadow:0 18px 42px rgba(92, 73, 170, .12);
}
html,body{background:#fbfbff}
body{position:relative;background:
 radial-gradient(circle at 7% 8%, rgba(255,210,123,.28), transparent 18%),
 radial-gradient(circle at 92% 7%, rgba(124,195,255,.22), transparent 20%),
 radial-gradient(circle at 16% 88%, rgba(114,229,198,.18), transparent 22%),
 radial-gradient(circle at 88% 82%, rgba(255,156,199,.18), transparent 18%),
 linear-gradient(180deg,#fdfcff 0%,#f8f8ff 48%,#f7fbff 100%);
 color:var(--ink)
}
body::before, body::after{content:"";position:fixed;z-index:0;border-radius:50%;pointer-events:none;filter:blur(18px);opacity:.5}
body::before{width:220px;height:220px;left:-70px;top:90px;background:radial-gradient(circle,#ffd56f 0%, rgba(255,213,111,0) 70%)}
body::after{width:260px;height:260px;right:-90px;top:220px;background:radial-gradient(circle,#8fd1ff 0%, rgba(143,209,255,0) 70%)}
.app,.main,.wrap,.sidebar{position:relative;z-index:1}
.sidebar{background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(247,242,255,.97) 40%,rgba(241,249,255,.97) 100%);border-right:0;box-shadow:12px 0 34px rgba(98,85,174,.08)}
.brand{padding-bottom:24px}
.brand-icon{background:linear-gradient(135deg,#7a5cf3,#ff9bc7 65%,#ffd66e);color:#fff;box-shadow:0 10px 22px rgba(122,92,243,.27)}
.brand strong{font-size:19px;line-height:1.06}
.brand strong span{background:linear-gradient(135deg,#6b52ea,#ff7fac);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-title{color:#8e8bac;letter-spacing:2px}
.nav{gap:8px}
.nav-item{background:rgba(255,255,255,.7);border:1px solid rgba(160,155,213,.18);border-radius:16px;color:#596583;box-shadow:0 4px 12px rgba(110,104,160,.04);transition:transform .18s ease, box-shadow .18s ease, background .18s ease}
.nav-item span{font-size:20px}
.nav-item:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(119,91,226,.12);background:#fff}
.nav-item.active{background:linear-gradient(135deg,#7e63ef 0%,#a26ff3 55%,#ff9ec0 100%);color:#fff;box-shadow:0 12px 24px rgba(122,92,243,.28)}
.sidebar-bottom{background:linear-gradient(135deg,#fff3cc,#fff0fb 50%,#eaf8ff 100%);border:1px solid rgba(255,200,118,.25);box-shadow:0 12px 30px rgba(255,199,106,.12)}
.sidebar-bottom strong{color:#5e45bf}
.wrap{max-width:1180px}
.topbar{position:sticky;top:14px;z-index:10;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);box-shadow:0 12px 28px rgba(109,98,170,.08);border:1px solid rgba(234,232,248,.95)}
.public-chip,.top-profile{background:rgba(255,255,255,.82);border:1px solid #ebe7f7;box-shadow:0 10px 22px rgba(108,93,170,.08)}
.avatar{background:linear-gradient(135deg,#f1edff,#fff3f8)}
.hero{background:linear-gradient(135deg,#6f5ae8 0%,#8c6cf4 38%,#ff90be 72%,#ffcb70 100%);box-shadow:0 24px 50px rgba(117,96,233,.24);border-radius:30px;min-height:240px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.16)}
.hero::before{width:180px;height:180px;right:130px;top:-40px}
.hero::after{width:120px;height:120px;right:30px;bottom:-25px}
.hero h1{max-width:660px;text-shadow:0 6px 18px rgba(79,52,173,.22)}
.hero p{font-size:15px;color:#fff7ff}
.hero .tag{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px)}
.hero-art{filter:drop-shadow(0 14px 26px rgba(88,47,152,.25));animation:heroFloat 3.6s ease-in-out infinite}
@keyframes heroFloat{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(-5deg) translateY(-8px)}}
.panel,.tile,.subject-card,.profile-card,.topic-card,.print-op,.print-count,.stat,.subject-option,.grade-card,.goal-card,.overview-card{border-radius:24px!important;border:1px solid rgba(226,223,244,.9)!important;box-shadow:var(--shadow);background:#fff}
.panel{overflow:hidden}
.panel h3,.section-head h2,.h1{color:#2e3860}
.tile,.subject-card,.topic-card,.profile-card{position:relative;overflow:hidden}
.tile::before,.subject-card::before,.topic-card::before,.profile-card::before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:linear-gradient(90deg,#7a5cf3,#65d9c8,#ffc86d,#ff8eb6)}
.tile:hover,.subject-card:hover,.topic-card:hover,.profile-card:hover{transform:translateY(-4px);box-shadow:0 24px 42px rgba(121,98,220,.14)}
.tile-icon{background:linear-gradient(135deg,#f3efff,#fff8fb);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 18px rgba(111,87,205,.08)}
.tile.mint{background:linear-gradient(180deg,#fff 0%,#f1fffb 100%)}
.tile.peach{background:linear-gradient(180deg,#fff 0%,#fff8ef 100%)}
.tile.sky{background:linear-gradient(180deg,#fff 0%,#f2f9ff 100%)}
.tile.purple{background:linear-gradient(180deg,#fff 0%,#f6f1ff 100%)}
.subject-card.mint{background:linear-gradient(180deg,#f5fffb,#ffffff)}
.subject-card.peach{background:linear-gradient(180deg,#fff8ec,#ffffff)}
.subject-card.sky{background:linear-gradient(180deg,#f1f8ff,#ffffff)}
.stats{gap:14px}
.stat{background:linear-gradient(180deg,#fff 0%,#faf8ff 100%)}
.stat:nth-child(1){background:linear-gradient(180deg,#f7efff,#fff)}
.stat:nth-child(2){background:linear-gradient(180deg,#eefdf7,#fff)}
.stat:nth-child(3){background:linear-gradient(180deg,#fff8ea,#fff)}
.stat strong{font-size:28px}
.section-head{align-items:end}
.tag{border:1px solid rgba(160,148,232,.22);background:#fff;color:#6f58d8;box-shadow:0 4px 12px rgba(116,92,216,.08)}
.tag.mint{background:#ebfff8;color:#14906e;border-color:#c9f1e3}
.tag.peach{background:#fff5e2;color:#b8730d;border-color:#ffe0a5}
.tag.rose{background:#fff0f6;color:#d04881;border-color:#ffd0e3}
.btn{border:0;box-shadow:0 10px 20px rgba(104,89,176,.08);border-radius:16px;padding:13px 18px;font-weight:900}
.btn-primary{background:linear-gradient(135deg,#785cf2,#9f6cf5 58%,#ff93bc);color:#fff;box-shadow:0 14px 26px rgba(122,92,243,.28)}
.btn-primary:hover{background:linear-gradient(135deg,#694be4,#8a5bf1 58%,#fb84af)}
.btn-quiet{background:linear-gradient(180deg,#f5f6fc,#ffffff);color:#59627f}
.btn-soft{background:linear-gradient(180deg,#f4efff,#fff8fd);color:#684cd8}
.btn-mint{background:linear-gradient(180deg,#e7fff6,#ffffff);color:#10866b}
.btn-outline{background:#fff;border:1px solid #e1daf8;color:#6850cf}
.btn-danger{background:linear-gradient(180deg,#fff0f3,#ffffff);color:#cc4360}
.question-box{background:linear-gradient(180deg,#fffdfd 0%,#f8f2ff 100%);border:1px solid #ede7fb;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 14px 28px rgba(118,100,209,.08);border-radius:26px;padding:34px 20px}
.q-kicker{color:#a78df3}
.equation,.question-prose{color:#2d3960}
.answer-row{background:linear-gradient(180deg,#ffffff,#fbf9ff);padding:18px;border-radius:26px;box-shadow:0 16px 34px rgba(116,97,202,.08)}
.answer-input{background:linear-gradient(180deg,#fff 0%,#f8f4ff 100%)!important;border:2px solid #d9cff8!important;box-shadow:inset 0 2px 10px rgba(122,92,243,.05)}
.answer-input:focus{outline:4px solid rgba(179,160,255,.45)!important;border-color:#9d84f5!important}
.answer-actions{gap:12px}
.keypad{background:linear-gradient(180deg,#fcfbff,#f5f6ff);padding:12px;border-radius:22px;border:1px solid #ece8fa;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.key{min-height:54px;background:linear-gradient(180deg,#fff,#f2f4ff);border:1px solid #dde2f3;border-radius:14px;box-shadow:0 8px 18px rgba(102,112,153,.08)}
.key.tool{background:linear-gradient(180deg,#f5f0ff,#ffffff);color:#6b55d6}
.feedback{border:1px solid transparent;box-shadow:0 10px 24px rgba(80,95,138,.06)}
.feedback.good{background:linear-gradient(180deg,#ebfff6,#f8fffc);border-color:#c5f2dd}
.feedback.warn{background:linear-gradient(180deg,#fff9eb,#fffefa);border-color:#ffe0a0}
.feedback.bad{background:linear-gradient(180deg,#fff1f4,#fff8f9);border-color:#ffd2dc}
.field{border-radius:14px;border:1px solid #dfddf2;background:linear-gradient(180deg,#fff,#fbfbff)}
.field:focus{outline:4px solid rgba(184,170,255,.34);border-color:#a087f4}
.topic-list,.subject-options{gap:14px}
.subject-option{border-radius:18px;background:linear-gradient(180deg,#fff,#fbf9ff);border:2px solid #e4def8;color:#36415f;box-shadow:0 10px 22px rgba(107,92,176,.06)}
.subject-option:hover{border-color:#ab97ff;transform:translateY(-2px)}
.subject-option.good{background:linear-gradient(180deg,#ecfff6,#ffffff)}
.subject-option.bad{background:linear-gradient(180deg,#fff2f4,#ffffff)}
.profile-card.add{background:linear-gradient(180deg,#fff,#faf8ff);border-style:dashed!important}
.mascot-encourage{background:linear-gradient(135deg,#fff5db,#fff4fd 50%,#eef9ff 100%);border:1px solid rgba(254,216,118,.38);box-shadow:0 12px 28px rgba(255,210,116,.15)}
.mascot-dock{filter:drop-shadow(0 18px 28px rgba(112,83,217,.18))}
.mascot-btn{background:linear-gradient(135deg,#7a5cf3,#ff93bd)!important;border:3px solid rgba(255,255,255,.7)!important;animation:mascotPulse 2.8s ease-in-out infinite}
.mascot-panel{background:linear-gradient(180deg,#fffdfa,#fff8fd 58%,#f4fbff);border:1px solid #ece3fb;box-shadow:0 22px 40px rgba(119,94,223,.18)}
@keyframes mascotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.small-fox{animation:mascotWiggle 2.6s ease-in-out infinite}
@keyframes mascotWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.mobile-nav{background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border:1px solid rgba(234,231,248,.9);box-shadow:0 -10px 30px rgba(92,77,169,.12);border-radius:22px 22px 0 0}
.mobile-nav button{border-radius:14px;padding:8px 6px}
.mobile-nav .active{background:linear-gradient(180deg,#f4efff,#fff7fb);color:#6c52dd}
.print-op.on,.print-count.on,.avatar-option.selected,.math-stage-buttons button.active{background:linear-gradient(135deg,#7a5cf3,#ff94bd)!important;color:#fff!important;border-color:transparent!important;box-shadow:0 14px 24px rgba(122,92,243,.24)}
@media (max-width: 900px){
  .topbar{top:8px;padding:10px 12px}
  .hero{border-radius:26px}
}
@media (max-width: 760px){
  .sidebar{box-shadow:none;background:transparent}
  .wrap{padding:16px 16px 100px}
  .topbar{border-radius:16px}
  .answer-row{padding:14px;border-radius:22px}
  .panel,.tile,.subject-card,.profile-card,.topic-card{border-radius:20px!important}
}


/* ===== 5.0 BAJECZNA KRAINA GIER ===== */
.magical-games,.home-adventure-grid,.house-grid{position:relative}
.magical-games::before{content:"";position:absolute;inset:-10px auto auto 72%;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.33),rgba(255,255,255,0) 70%);pointer-events:none}
.home-adventure-grid .tile{min-height:185px}
.house-grid{display:grid;grid-template-columns:1.15fr .95fr;gap:18px}
.house-room{overflow:hidden}
.house-room-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.fox-hero{font-size:64px;animation:foxFloat 2.8s ease-in-out infinite}
.house-scene{min-height:300px;border-radius:24px;padding:18px;background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.92));border:1px dashed rgba(151,140,219,.35);display:flex;flex-direction:column;justify-content:space-between;gap:12px;position:relative;overflow:hidden}
.house-scene::before{content:"";position:absolute;left:-30px;bottom:-30px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,215,120,.35),rgba(255,215,120,0) 72%)}
.scene-bubbles{font-size:24px;letter-spacing:8px;opacity:.8}
.room-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}
.room-item{background:rgba(255,255,255,.82);border:1px solid rgba(224,220,248,.9);border-radius:18px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;box-shadow:0 10px 20px rgba(104,89,176,.08)}
.room-item span{font-size:34px}
.room-item small{text-align:center;color:#60708d;font-weight:700;line-height:1.25}
.fox-bubble{align-self:flex-start;max-width:280px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 10px 22px rgba(120,98,203,.1);color:#5e6488;font-weight:700}
.theme-row{display:flex;flex-wrap:wrap;gap:10px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.shop-product.selected{box-shadow:0 0 0 3px rgba(122,92,243,.16),0 18px 32px rgba(122,92,243,.14)}
.shop-product .btn{margin-top:10px}
.cosmos-track{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:18px 0 22px}
.planet{height:72px;border-radius:22px;background:linear-gradient(180deg,#f4f1ff,#ffffff);display:flex;align-items:center;justify-content:center;font-size:32px;border:1px solid #e8e3f9;box-shadow:0 10px 20px rgba(110,93,177,.08)}
.planet.done{background:linear-gradient(180deg,#e8fff4,#ffffff)}
.planet.current{outline:4px solid rgba(122,92,243,.22);transform:translateY(-3px)}
.soft-panel{background:linear-gradient(180deg,#fff8ff,#ffffff)!important}
@keyframes foxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (max-width: 900px){.house-grid{grid-template-columns:1fr}.room-items{grid-template-columns:repeat(2,minmax(0,1fr))}.cosmos-track{grid-template-columns:repeat(3,1fr)}}


/* ========= BAJKOWY DOM & KLAWIATURA 5.1 ========= */
.magic-keypad{background:linear-gradient(155deg,#f3edff,#fcf8ff 48%,#ecfaff);border:1px solid #dbd2fa;border-radius:26px;padding:14px;box-shadow:0 14px 30px rgba(105,79,207,.10);width:min(100%,350px);margin:auto}
.magic-keypad-title{display:flex;gap:10px;align-items:center;justify-content:center;text-align:center;font-size:14px;font-weight:900;color:#7454cf;margin-bottom:12px}
.magic-keypad-title span{font-size:22px}
.magic-keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}

function normalizeTest(t){
 if(!t||!Array.isArray(t.questions)||!t.questions.length)return null;
 const n=t.questions.length;
 t.answers=Array.from({length:n},(_,i)=>hasAnswer(t.answers?.[i])?String(t.answers[i]):'');
 t.corrections=Array.from({length:n},(_,i)=>hasAnswer(t.corrections?.[i])?String(t.corrections[i]):'');
 if(!['answering','review','correction','complete'].includes(t.phase))t.phase='answering';
 if(!Array.isArray(t.wrong))t.wrong=[];
 t.wrong=t.wrong.filter(i=>Number.isInteger(i)&&i>=0&&i<n);
 if(t.phase!=='answering'&&t.phase!=='complete'&&t.wrong.length===0)
   t.wrong=t.questions.flatMap((q,i)=>correctAnswer(t.answers[i],q)?[]:[i]);
 const indices=t.phase==='correction'?t.wrong:Array.from({length:n},(_,i)=>i);
 if(!indices.includes(t.index))t.index=indices[0]??0;
 t.paused=Boolean(t.paused);
 t.saved=Boolean(t.saved);
 return t;
}

function sceneFurniture(key,h){
 const pos=autoHousePosition(key,h),wall=isWallItem(key),low=key==='rug_leaf'||key==='pond';
 const count=roomItems(h).filter(k=>isWallItem(k)===wall).length;
 let size=itemSize(key);
 if(count>=10)size=Math.min(size,wall?13:15);
 else if(count>=7)size=Math.min(size,wall?15:19);
 if(['bed_basic','bubble_bath','sofa_velvet','tree_magic'].includes(key))size=Math.max(size,22);
 return `<button type="button" data-act="houseUse" data-item="${key}" class="room-furniture pet-auto-furniture ${wall?'on-wall':''} ${low?'on-floor':''}" style="left:${pos.x}%;top:${pos.y}%;width:${size}%;z-index:${low?2:wall?4:Math.round(pos.y)}" title="${esc(houseItemUse(key).label)}" aria-label="${esc(houseItemUse(key).label)}: ${esc(HOUSE_ITEMS[key]?.name||key)}">${itemSvg(key)}<span class="pet-item-sparkle" aria-hidden="true">✨</span></button>`;

function makeDeck(bank,size=5){return shuffle([...bank]).slice(0,size).map(q=>JSON.parse(JSON.stringify(q)))}
function ensureWordGame(){if(!wordGame)wordGame={deck:makeDeck(WORD_FACTORY_BANK,5),index:0,tries:0,status:'new',selected:null,correct:0,done:false};return wordGame}
function ensureForestGame(){if(!forestGame)forestGame={deck:makeDeck(FOREST_BANK,5),index:0,tries:0,status:'new',selected:null,correct:0,done:false};return forestGame}
function nextDeckQuestion(g){g.index++;g.tries=0;g.status='new';g.selected=null;if(g.index>=g.deck.length)g.done=true}
function answerDeckGame(kind,idx){const g=kind==='word'?ensureWordGame():ensureForestGame();if(g.done||!g.deck[g.index])return;const q=g.deck[g.index];g.selected=idx;if(idx===q.answer){g.correct++;g.status='good';profile.stats.stars+=2;profile.stats.coins=(ensureCoins()+2);reward('good');persist();render();toast('Brawo! +2 monetki');}else if(g.tries===0){g.tries=1;g.status='retry';reward('bad');render();}else{g.status='show';reward('bad');render();}}
function nextDeck(kind){const g=kind==='word'?ensureWordGame():ensureForestGame();if(!g)return;nextDeckQuestion(g);if(g.done){if(kind==='word')profile.stats.wordWins=(profile.stats.wordWins||0)+1;else profile.stats.forestWins=(profile.stats.forestWins||0)+1;profile.stats.stars+=6;profile.stats.coins=(ensureCoins()+4);persist();reward('good');}render()}
function resetDeck(kind){if(kind==='word')wordGame=null;else forestGame=null;render()}

const SOUND_KEY='mkn_sound_4_1';const ANIM_KEY='mkn_animations_4_1';
let soundEnabled=localStorage.getItem(SOUND_KEY)!=='off';
let animationsEnabled=localStorage.getItem(ANIM_KEY)!=='off' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let feedbackAudioContext=null;
let mascotOpen=false;
function playSound(kind){
 if(!soundEnabled)return;
 try{
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return;
  const ctx=feedbackAudioContext||(feedbackAudioContext=new AudioContextClass());
  if(ctx.state==='suspended')ctx.resume().catch(()=>{});
  const now=ctx.currentTime;
  // Wesołe, delikatne dzwoneczki po sukcesie; po błędzie łagodne dwa niskie tony.
  const notes=kind==='good'?[{f:659.25,t:0},{f:783.99,t:.11},{f:1046.5,t:.22}]:[{f:392,t:0},{f:349.23,t:.18}];
  for(const n of notes){const osc=ctx.createOscillator(),gain=ctx.createGain();
   osc.type=kind==='good'?'sine':'triangle';osc.frequency.setValueAtTime(n.f,now+n.t);
   gain.gain.setValueAtTime(.0001,now+n.t);
   gain.gain.exponentialRampToValueAtTime(kind==='good'?.028:.018,now+n.t+.019);
   gain.gain.exponentialRampToValueAtTime(.0001,now+n.t+.22);
   osc.connect(gain);gain.connect(ctx.destination);osc.start(now+n.t);osc.stop(now+n.t+.23)
  }
 }catch(_e){}
}

function pickSubjectQuestion(key){
 const pool=[...(SUBJECT_LIBRARY[key]||SUBJECT_LIBRARY.reading),...(SUBJECT_BONUS[key]||[])].filter(q=>(q.minGrade||1)<=Number(profile?.grade||2));
 if(!pool.length)throw Error('Nie znaleziono pytań w tym przedmiocie.');
 if(!subjectQuestionDecks[key]||!subjectQuestionDecks[key].length)subjectQuestionDecks[key]=shuffle(Array.from({length:pool.length},(_,i)=>i));
 const q=JSON.parse(JSON.stringify(pool[subjectQuestionDecks[key].pop()]));
 const opts=q.options.map((value,i)=>({value,correct:i===q.answer}));shuffle(opts);
 q.options=opts.map(o=>o.value);q.answer=opts.findIndex(o=>o.correct);q.key=key;
 return q;
}
let subjectMission={goal:10,done:0,good:0};
function startSubject(key,resetMission=false){
 subjectKey=key;
 if(resetMission)subjectMission={goal:10,done:0,good:0};
 subjectActivity={q:pickSubjectQuestion(key),status:'new',tries:0,selected:null};
 show('subjects');
}
function nextSubjectQuestion(){
 if(subjectActivity?.status==='new'||subjectActivity?.status==='retry'){toast('Najpierw dokończ bieżące pytanie.');return}
 if(subjectMission.done>=subjectMission.goal){
  subjectActivity=null;show('subjects');reward('good');toast('🦊 Fikuś: Misja ukończona!');
  subjectMission={goal:10,done:0,good:0};return;
 }
 startSubject(subjectKey);

function answerSubject(idx){
 if(!subjectActivity||subjectActivity.status==='good'||subjectActivity.status==='show')return;

 if(idx===act.q.answer){
  act.status='good';subjectStats(subjectKey).good++;subjectStats(subjectKey).total++;profile.stats.stars+=act.tries?1:2;subjectMission.good++;subjectMission.done++;
  persist();reward('good');render(true);return;
 }

function walkFoxToPoint(x){

 const fox=room.querySelector('.pet-idle-fox');
 if(!fox)return;
 const target=roomClamp(x,17,83);
 const prior=Number(h.foxPositions?.[h.room]??50);
 h.foxPositions[h.room]=+target.toFixed(1);h.activity=null;
 const facing=target<prior?'left':'right';
 fox.classList.remove('pet-fox-walking','pet-facing-left');
 if(facing==='left')fox.classList.add('pet-facing-left');
 fox.classList.add('pet-fox-walking');
 fox.style.left=target+'%';
 const bubble=room.querySelector('.pet-hint-bubble');if(bubble)bubble.textContent='Tup, tup! 🐾';

 setTimeout(()=>{if(fox.isConnected){fox.classList.remove('pet-fox-walking');if(bubble?.isConnected)bubble.textContent=petFriendlyMessage(h).text}},900);

function petSetAction(mode){
 const h=ensureHouse();petEditMode=false;houseSelection=null;housePanel='';
 if(mode==='feed'){housePanel='food';render(true);return}
 let key=null,room=h.room;
 if(mode==='sleep'){room='bedroom';key=h.placed.includes('bed_basic')?'bed_basic':null}
 else if(mode==='bath'){room='bathroom';key=h.placed.includes('bubble_bath')?'bubble_bath':null}
 else if(mode==='play'){room='living';key=h.placed.find(k=>itemRoom(k)==='living'&&['play','piano','paint','dance','hug','music'].includes(houseItemUse(k).mode))||null}
 h.room=room;
 if(key){persist();useHouseItem(key);return}

 const a=wording[mode]||wording.play;h.activity={room:h.room,item:null,mode,emoji:a.emoji,text:a.text,stamp:Date.now()};
 h.needs=petNeeds(h);if(mode==='sleep')h.needs.energy=clampNeed(h.needs.energy+14);

function flipMemory(i){const g=ensureMemory();if(g.locked||g.finished||g.open.includes(i)||g.matched.includes(g.cards[i]?.pair)||!g.cards[i])return;g.open.push(i);if(g.open.length===2){g.moves++;g.locked=true;const a=g.cards[g.open[0]],b=g.cards[g.open[1]],isPair=a.pair===b.pair&&a.isQuestion!==b.isQuestion;if(isPair){g.matched.push(a.pair);updatePracticeStats(g.qs[a.pair],true,0);reward('good');setTimeout(()=>{g.open=[];g.locked=false;if(g.matched.length===g.qs.length&&!g.finished){g.finished=true;profile.stats.memoryWins=(profile.stats.memoryWins||0)+1;profile.stats.stars+=6;profile.stats.coins=ensureCoins()+4;persist();toast('🏆 Brawo! Trzy pary znalezione! +4 monetki')}if(screen==='memory')render()},380)}else{reward('bad');setTimeout(()=>{g.open=[];g.locked=false;if(screen==='memory')render()},850)}}render()}

async function adminLogin(email,password){const r=await fetch(AUTH_URL+'/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':PUBLIC_KEY},body:JSON.stringify({email,password})});const data=await r.json();if(!r.ok||!data.access_token)throw Error(data.msg||data.error_description||'Nieprawidłowe dane logowania.');adminSession=data;sessionStorage.setItem('magic_admin_session',JSON.stringify(adminSession));try{await loadAdminReports()}catch(e){adminSession=null;sessionStorage.removeItem('magic_admin_session');if(/Brak uprawnień administratora/.test(e.message))throw Error('Konto działa, ale nie ma jeszcze nadanych uprawnień administratora. Zgłoś potwierdzenie rejestracji właścicielowi platformy.');throw e}}

function setTest(t){t.paused=false;profile.activeTest=normalizeTest(t);persist();show('test')}
function testIndices(t){return t.phase==='correction'?t.wrong:Array.from({length:t.questions.length},(_,i)=>i)}
function moveTest(delta){
 const t=profile.activeTest,idxs=testIndices(t);if(!idxs.length)return;
 let pos=idxs.indexOf(t.index);if(pos<0)pos=0;
 t.index=idxs[Math.min(idxs.length-1,Math.max(0,pos+delta))];
 persist();render(true);
}
function finishTest(){
 const t=profile.activeTest;
 const blanks=t.answers.filter(v=>!hasAnswer(v)).length;
 if(blanks&&!confirm(`Nie odpowiedziano na ${blanks} ${blanks===1?'zadanie':blanks<5?'zadania':'zadań'}. Puste odpowiedzi zostaną ocenione jako błędne. Czy zakończyć test?`))return;
 t.first=t.questions.reduce((n,q,i)=>n+(correctAnswer(t.answers[i],q)?1:0),0);
 t.wrong=t.questions.flatMap((q,i)=>correctAnswer(t.answers[i],q)?[]:[i]);
 t.phase='review';t.paused=false;
 persist();render();window.scrollTo(0,0);
}
function completeTest(corrected){
 const t=profile.activeTest;
 t.didCorrect=corrected;
 t.final=t.questions.reduce((n,q,i)=>{
  const ans=corrected&&t.wrong.includes(i)?t.corrections[i]:t.answers[i];
  return n+(correctAnswer(ans,q)?1:0);
 },0);
 t.phase='complete';t.paused=false;t.finishedAt=new Date().toISOString();
 if(!t.saved){let s=profile.stats;
  const details=t.questions.map((q,i)=>({n:i+1,topic:q.topic,question:String(q.expression||q.prompt||''),correct:String(q.answer),first:hasAnswer(t.answers[i])?String(t.answers[i]):'',after:corrected&&t.wrong.includes(i)?(hasAnswer(t.corrections[i])?String(t.corrections[i]):''):null,firstOk:correctAnswer(t.answers[i],q),finalOk:correctAnswer(corrected&&t.wrong.includes(i)?t.corrections[i]:t.answers[i],q)}));
  s.testHistory.unshift({id:t.id,date:t.finishedAt,kind:t.kind,grade:t.grade,topic:t.topic,topics:t.topics||null,first:t.first,final:t.final,total:t.questions.length,omitted:t.answers.filter(v=>!hasAnswer(v)).length,corrected:corrected,details});
  s.testHistory.forEach((h,i)=>{if(i>=18&&h.details)delete h.details});
  s.testHistory=s.testHistory.slice(0,150);
  if(t.kind==='daily')s.dailyHistory[dateKey()]=t.final;
  t.saved=true;
  s.stars+=Math.max(1,Math.floor(t.final/3));
 }
 persist();render();window.scrollTo(0,0);
}
function finishCorrection(){
 const t=profile.activeTest;
 const missing=t.wrong.filter(i=>!hasAnswer(t.corrections[i])).length;
 if(missing&&!confirm(`Nie poprawiono ${missing} ${missing===1?'zadania':missing<5?'zadań':'zadań'}. Puste poprawy pozostaną błędami. Czy zakończyć poprawę?`))return;
 completeTest(true);
}
async function pauseTest(){
 const t=pendingTest();if(!t){show('home');return}
 t.paused=true;persist();
 const saved=await ensureSavedTest();
 if(!saved){t.paused=false;render();toast('Nie udało się zapisać sprawdzianu w chmurze. Spróbuj ponownie po odzyskaniu internetu.');return}
 show('home');toast('Sprawdzian zapisany! Wznów go w dowolnej chwili, także na innym urządzeniu.');
}
async function ensureSavedTest(){
 // Wait for the currently in-flight request to release its database revision.
 let attempts=0;
 while(saving&&attempts++<60)await new Promise(r=>setTimeout(r,100));
 if(saving)return false;
 if(pending)await flushSave();
 return !pending&&!saving&&!saveError;
}
async function resumeTest(){
 const local=pendingTest();if(!local){show('test');return}
 if(!(await ensureSavedTest())){toast('Nie można odczytać zapisanej wersji. Sprawdź internet i spróbuj ponownie.');return}
 try{
  const remote=await api('load',{token:childToken});
  if(remote?.profile){
   const next=asProfile(remote.profile);
   if(next.activeTest&&next.activeTest.id===local.id){profile=next}
  }
 }catch(e){toast('Nie udało się sprawdzić wersji w chmurze: '+e.message);return}
 profile.activeTest.paused=false;
 persist();show('test');
}
function updateAnswer(value){
 const el=$('answer');if(!el||(el.readOnly&&!el.dataset.onscreen))return;
 const v=String(value).replace(/[^0-9]/g,'').slice(0,5);el.value=v;
 if(screen==='test'&&profile.activeTest){
  const t=profile.activeTest;
  if(!['answering','correction'].includes(t.phase))return;
  const arr=t.phase==='correction'?t.corrections:t.answers;
  arr[t.index]=v;persist();
  const indices=testIndices(t),filled=indices.filter(i=>hasAnswer(arr[i])).length;
  const bar=app.querySelector('.exam-progress div');if(bar)bar.style.width=percent(filled,indices.length)+'%';
  const dot=app.querySelector(`.dot[data-index="${t.index}"]`);
  if(dot){dot.classList.toggle('filled',hasAnswer(v));dot.setAttribute('aria-label',`Zadanie ${t.index+1}, ${hasAnswer(v)?'odpowiedź wpisana':'brak odpowiedzi'}`)}
  const small=app.querySelector('.panel .small');if(small)small.textContent=`Wpisane: ${filled} / ${indices.length}`;
 }else if(practice)practice.answer=v;
}

function practiceSubmit(){let val=practice.answer;if(val===''){toast('Najpierw wpisz wynik!');return}if(practice.status==='good'||practice.status==='show'){nextPractice();return}let q=practice.q;if(Number(val)===q.answer){practice.status='good';updatePracticeStats(q,true,practice.tries);reward('good')}else{logMistake('Ćwiczenie',q.topic,q.expression||q.prompt,val,q.answer);practice.tries++;if(practice.tries===1){practice.status='retry';practice.answer='';reward('bad')}else{practice.status='show';updatePracticeStats(q,false,practice.tries);reward('bad')}}render()}
