    { subject: 'english', id: 'en-fav1', grade: 2, title: 'The colourful box', unit: '1. My favourite things', scene: 'toys', emoji: '🎨', subtitle: 'Kolory i ulubione rzeczy', body: 'Look at my box! I have a red ball, a blue car and a yellow kite. My favourite toy is the blue car.', translation: 'Spójrz na moje pudełko! Mam czerwoną piłkę, niebieski samochodzik i żółty latawiec. Moja ulubiona zabawka to niebieski samochodzik.', vocab: [{ en: 'red', pl: 'czerwony' }, { en: 'blue', pl: 'niebieski' }, { en: 'ball', pl: 'piłka' }, { en: 'kite', pl: 'latawiec' }], questions: [q('en-f1-1', 'What colour is the ball?', ['Blue', 'Red', 'Green'], 1, 'Listen for „red ball”.', 'listen-colours'), q('en-f1-2', 'What is Fikuś’s favourite toy?', ['A kite', 'A ball', 'A car'], 2, 'Favourite means ulubiony.', 'listen-preferences'), q('en-f1-3', 'What colour is the kite?', ['Yellow', 'Pink', 'Purple'], 0, 'Listen for „yellow kite”.', 'listen-colours')] },
    { subject: 'english', id: 'en-fav2', grade: 2, title: 'My school bag', unit: '1. My favourite things', scene: 'school', emoji: '🎒', subtitle: 'Rzeczy w plecaku', body: 'This is my green bag. I have two pencils and one book. My ruler is orange. I like my pencils!', translation: 'To mój zielony plecak. Mam dwa ołówki i jedną książkę. Moja linijka jest pomarańczowa. Lubię swoje ołówki!', vocab: [{ en: 'pencil', pl: 'ołówek' }, { en: 'ruler', pl: 'linijka' }, { en: 'book', pl: 'książka' }, { en: 'bag', pl: 'plecak' }], questions: [q('en-f2-1', 'How many pencils?', ['One', 'Two', 'Three'], 1, 'Listen for two.', 'listen-numbers'), q('en-f2-2', 'What colour is the ruler?', ['Orange', 'Blue', 'Yellow'], 0, 'The ruler is orange.', 'listen-colours'), q('en-f2-3', 'What is green?', ['The pencil', 'The book', 'The bag'], 2, 'The bag is green.', 'listen-objects')] },
    { subject: 'english', id: 'en-family1', grade: 2, title: 'Meet my family', unit: '2. My family', scene: 'family', emoji: '👨‍👩‍👧', subtitle: 'Poznaj rodzinę Fikusia', body: 'Hello! This is my mum. Her name is Mia. This is my brother Max. He likes football. I love my family!', translation: 'Cześć! To moja mama. Ma na imię Mia. To mój brat Max. Lubi piłkę nożną. Kocham swoją rodzinę!', vocab: [{ en: 'mum', pl: 'mama' }, { en: 'brother', pl: 'brat' }, { en: 'family', pl: 'rodzina' }, { en: 'likes', pl: 'lubi' }], questions: [q('en-fa1-1', 'Who is Max?', ['Mum', 'Brother', 'Grandad'], 1, 'Listen for „my brother Max”.', 'listen-family'), q('en-fa1-2', 'What does Max like?', ['Music', 'Football', 'Ice cream'], 1, 'He likes football.', 'listen-hobbies'), q('en-fa1-3', 'What is mum’s name?', ['Mia', 'Sara', 'Kate'], 0, 'Her name is Mia.', 'listen-names')] },
    { subject: 'english', id: 'en-family2', grade: 2, title: 'At Grandma’s house', unit: '2. My family', scene: 'home', emoji: '🏡', subtitle: 'Odwiedziny', body: 'Today I visit my grandma. She has a small white cat. My grandad makes tea. We sit and talk together.', translation: 'Dzisiaj odwiedzam babcię. Ma małego białego kota. Dziadek robi herbatę. Siedzimy i rozmawiamy razem.', vocab: [{ en: 'grandma', pl: 'babcia' }, { en: 'grandad', pl: 'dziadek' }, { en: 'white', pl: 'biały' }, { en: 'cat', pl: 'kot' }], questions: [q('en-fa2-1', 'Who has a cat?', ['Grandma', 'Brother', 'Mum'], 0, 'She has a small white cat.', 'listen-family'), q('en-fa2-2', 'What colour is the cat?', ['Black', 'White', 'Brown'], 1, 'Listen for white.', 'listen-colours'), q('en-fa2-3', 'What does grandad make?', ['Soup', 'Cake', 'Tea'], 2, 'Grandad makes tea.', 'listen-actions')] },
    { subject: 'english', id: 'en-body1', grade: 2, title: 'Funny monster', unit: '3. My body and face', scene: 'monster', emoji: '👾', subtitle: 'Części ciała', body: 'Look! My monster has three eyes, two big ears and one purple nose. It has four green arms. It is very funny!', translation: 'Spójrz! Mój potworek ma troje oczu, dwoje dużych uszu i jeden fioletowy nos. Ma cztery zielone ręce. Jest bardzo zabawny!', vocab: [{ en: 'eyes', pl: 'oczy' }, { en: 'ears', pl: 'uszy' }, { en: 'nose', pl: 'nos' }, { en: 'arms', pl: 'ręce' }], questions: [q('en-b1-1', 'How many eyes?', ['Two', 'Three', 'Four'], 1, 'Three eyes.', 'listen-body'), q('en-b1-2', 'What colour is the nose?', ['Pink', 'Purple', 'Green'], 1, 'Purple nose.', 'listen-colours'), q('en-b1-3', 'How many arms?', ['Two', 'Three', 'Four'], 2, 'Four green arms.', 'listen-numbers')] },
    { subject: 'english', id: 'en-body2', grade: 2, title: 'Let’s dance!', unit: '3. My body and face', scene: 'dance', emoji: '💃', subtitle: 'Wesoły taniec', body: 'Clap your hands! Move your legs! Touch your head! Now smile. We can dance together!', translation: 'Klaśnij w dłonie! Porusz nogami! Dotknij głowy! Teraz się uśmiechnij. Możemy razem tańczyć!', vocab: [{ en: 'hands', pl: 'dłonie' }, { en: 'legs', pl: 'nogi' }, { en: 'head', pl: 'głowa' }, { en: 'smile', pl: 'uśmiech' }], questions: [q('en-b2-1', 'What should you clap?', ['Hands', 'Feet', 'Eyes'], 0, 'Clap your hands.', 'listen-body'), q('en-b2-2', 'What should you touch?', ['Your nose', 'Your head', 'Your ears'], 1, 'Touch your head.', 'listen-actions'), q('en-b2-3', 'What can they do?', ['Swim', 'Dance', 'Fly'], 1, 'We can dance together.', 'listen-actions')] },
    { subject: 'english', id: 'en-room1', grade: 2, title: 'My little room', unit: '4. My room', scene: 'bedroom', emoji: '🛏️', subtitle: 'Mój pokój', body: 'In my room there is a bed, a desk and a small lamp. The teddy bear is on my bed. My books are on the desk.', translation: 'W moim pokoju jest łóżko, biurko i mała lampka. Miś leży na łóżku. Moje książki są na biurku.', vocab: [{ en: 'bed', pl: 'łóżko' }, { en: 'desk', pl: 'biurko' }, { en: 'lamp', pl: 'lampka' }, { en: 'teddy bear', pl: 'miś' }], questions: [q('en-r1-1', 'Where is the teddy bear?', ['On the bed', 'Under the desk', 'In the garden'], 0, 'On the bed means na łóżku.', 'listen-position'), q('en-r1-2', 'Where are the books?', ['On the floor', 'On the desk', 'On the bed'], 1, 'Books are on the desk.', 'listen-position'), q('en-r1-3', 'Is there a lamp?', ['Yes', 'No', 'Not sure'], 0, 'There is a small lamp.', 'listen-room')] },
    { subject: 'english', id: 'en-room2', grade: 2, title: 'Where is my sock?', unit: '4. My room', scene: 'bedroom', emoji: '🧦', subtitle: 'Gdzie jest skarpetka?', body: 'Oh no! Where is my blue sock? It is not under the bed. It is next to the chair! My red hat is in the box.', translation: 'O nie! Gdzie jest moja niebieska skarpetka? Nie ma jej pod łóżkiem. Jest obok krzesła! Mój czerwony kapelusz jest w pudełku.', vocab: [{ en: 'under', pl: 'pod' }, { en: 'next to', pl: 'obok' }, { en: 'in', pl: 'w' }, { en: 'sock', pl: 'skarpetka' }], questions: [q('en-r2-1', 'Where is the sock?', ['Under the bed', 'Next to the chair', 'In the box'], 1, 'Next to means obok.', 'listen-position'), q('en-r2-2', 'What colour is the sock?', ['Blue', 'Red', 'Pink'], 0, 'Blue sock.', 'listen-colours'), q('en-r2-3', 'What is in the box?', ['A book', 'A toy', 'A hat'], 2, 'My red hat is in the box.', 'listen-position')] },
    { subject: 'english', id: 'en-can1', grade: 2, title: 'I can jump!', unit: '5. I can jump!', scene: 'garden', emoji: '🦘', subtitle: 'Co potrafię?', body: 'I can jump and run. My friend Luna can swim, but she cannot fly. We can both dance and sing!', translation: 'Potrafię skakać i biegać. Moja przyjaciółka Luna potrafi pływać, ale nie umie latać. Oboje potrafimy tańczyć i śpiewać!', vocab: [{ en: 'jump', pl: 'skakać' }, { en: 'run', pl: 'biegać' }, { en: 'swim', pl: 'pływać' }, { en: 'fly', pl: 'latać' }], questions: [q('en-c1-1', 'What can Luna do?', ['Swim', 'Fly', 'Drive'], 0, 'Luna can swim.', 'listen-abilities'), q('en-c1-2', 'Can Luna fly?', ['Yes', 'No', 'Sometimes'], 1, 'Cannot = nie potrafi.', 'listen-abilities'), q('en-c1-3', 'What can both friends do?', ['Cook', 'Sleep', 'Dance'], 2, 'We can both dance and sing.', 'listen-abilities')] },
    { subject: 'english', id: 'en-can2', grade: 2, title: 'The school show', unit: '5. I can jump!', scene: 'stage', emoji: '🎪', subtitle: 'Występ w szkole', body: 'Emma can sing a song. Ben can play the drums. I can draw a big star. We are ready for the school show!', translation: 'Emma potrafi zaśpiewać piosenkę. Ben umie grać na bębnach. Potrafię narysować dużą gwiazdę. Jesteśmy gotowi na szkolny występ!', vocab: [{ en: 'sing', pl: 'śpiewać' }, { en: 'play', pl: 'grać' }, { en: 'draw', pl: 'rysować' }, { en: 'show', pl: 'występ' }], questions: [q('en-c2-1', 'Who can play the drums?', ['Emma', 'Ben', 'Fikuś'], 1, 'Ben can play the drums.', 'listen-abilities'), q('en-c2-2', 'What can Emma do?', ['Sing', 'Draw', 'Jump'], 0, 'Emma can sing a song.', 'listen-abilities'), q('en-c2-3', 'What can Fikuś draw?', ['A tree', 'A cat', 'A star'], 2, 'A big star.', 'listen-actions')] },
    { subject: 'english', id: 'en-food1', grade: 2, title: 'Picnic in the park', unit: '6. He likes cheese!', scene: 'picnic', emoji: '🧀', subtitle: 'Jedzenie i upodobania', body: 'My friend Max likes cheese and apples. I like carrots and orange juice. We have a picnic in the park!', translation: 'Mój przyjaciel Max lubi ser i jabłka. Ja lubię marchewki i sok pomarańczowy. Mamy piknik w parku!', vocab: [{ en: 'cheese', pl: 'ser' }, { en: 'apples', pl: 'jabłka' }, { en: 'carrots', pl: 'marchewki' }, { en: 'juice', pl: 'sok' }], questions: [q('en-fo1-1', 'What does Max like?', ['Cheese', 'Carrots', 'Rice'], 0, 'Max likes cheese and apples.', 'listen-food'), q('en-fo1-2', 'What juice does Fikuś like?', ['Apple', 'Orange', 'Pear'], 1, 'Orange juice.', 'listen-food'), q('en-fo1-3', 'Where is the picnic?', ['At school', 'At home', 'In the park'], 2, 'In the park.', 'listen-places')] },
    { subject: 'english', id: 'en-food2', grade: 2, title: 'A surprise breakfast', unit: '6. He likes cheese!', scene: 'kitchen', emoji: '🍓', subtitle: 'Śniadanie', body: 'Dad likes eggs. Mum likes toast. My sister likes bananas. I do not like milk, but I like strawberries!', translation: 'Tata lubi jajka. Mama lubi tosty. Moja siostra lubi banany. Nie lubię mleka, ale lubię truskawki!', vocab: [{ en: 'eggs', pl: 'jajka' }, { en: 'toast', pl: 'tost' }, { en: 'bananas', pl: 'banany' }, { en: 'strawberries', pl: 'truskawki' }], questions: [q('en-fo2-1', 'Who likes eggs?', ['Dad', 'Mum', 'Sister'], 0, 'Dad likes eggs.', 'listen-food'), q('en-fo2-2', 'What does sister like?', ['Milk', 'Bananas', 'Toast'], 1, 'Sister likes bananas.', 'listen-food'), q('en-fo2-3', 'What does Fikuś NOT like?', ['Strawberries', 'Eggs', 'Milk'], 2, 'I do not like milk.', 'listen-negation')] },
    { subject: 'english', id: 'en-world1', grade: 2, title: 'A day in the park', unit: '7. Our world', scene: 'garden', emoji: '🌳', subtitle: 'Świat przyrody', body: 'It is sunny today. I can see a tall tree, two birds and a small pond. There is a frog next to the pond.', translation: 'Dziś jest słonecznie. Widzę wysokie drzewo, dwa ptaki i mały staw. Obok stawu jest żaba.', vocab: [{ en: 'sunny', pl: 'słonecznie' }, { en: 'tree', pl: 'drzewo' }, { en: 'bird', pl: 'ptak' }, { en: 'pond', pl: 'staw' }], questions: [q('en-w1-1', 'How many birds?', ['One', 'Two', 'Three'], 1, 'Two birds.', 'listen-numbers'), q('en-w1-2', 'What is next to the pond?', ['A frog', 'A dog', 'A fox'], 0, 'There is a frog.', 'listen-nature'), q('en-w1-3', 'What is the weather like?', ['Rainy', 'Snowy', 'Sunny'], 2, 'It is sunny today.', 'listen-weather')] },
    { subject: 'english', id: 'en-world2', grade: 2, title: 'A rainy afternoon', unit: '7. Our world', scene: 'rain', emoji: '☔', subtitle: 'Pogoda i otoczenie', body: 'The sky is grey. It is raining. I have a yellow umbrella. My friend has blue boots. We jump in small puddles!', translation: 'Niebo jest szare. Pada deszcz. Mam żółty parasol. Moja przyjaciółka ma niebieskie kalosze. Skaczemy po małych kałużach!', vocab: [{ en: 'rain', pl: 'deszcz' }, { en: 'umbrella', pl: 'parasol' }, { en: 'boots', pl: 'kalosze' }, { en: 'puddle', pl: 'kałuża' }], questions: [q('en-w2-1', 'What colour is the umbrella?', ['Red', 'Yellow', 'Green'], 1, 'Yellow umbrella.', 'listen-colours'), q('en-w2-2', 'What colour are the boots?', ['Blue', 'Red', 'Black'], 0, 'Blue boots.', 'listen-colours'), q('en-w2-3', 'What is the weather like?', ['Sunny', 'Snowy', 'Rainy'], 2, 'It is raining.', 'listen-weather')] },
    { subject: 'english', id: 'en-clothes1', grade: 2, title: 'The funny hat', unit: '8. What’s he wearing?', scene: 'wardrobe', emoji: '🧢', subtitle: 'Ubrania', body: 'Look at Leo! He is wearing a green hat and a red jacket. His shoes are blue. He looks very funny!', translation: 'Spójrz na Leo! Ma na sobie zielony kapelusz i czerwoną kurtkę. Jego buty są niebieskie. Wygląda bardzo zabawnie!', vocab: [{ en: 'hat', pl: 'kapelusz' }, { en: 'jacket', pl: 'kurtka' }, { en: 'shoes', pl: 'buty' }, { en: 'wearing', pl: 'ma na sobie' }], questions: [q('en-cl1-1', 'What colour is the jacket?', ['Red', 'Blue', 'Yellow'], 0, 'A red jacket.', 'listen-clothes'), q('en-cl1-2', 'What colour are the shoes?', ['Green', 'Blue', 'Black'], 1, 'Blue shoes.', 'listen-colours'), q('en-cl1-3', 'What is green?', ['Shoes', 'Jacket', 'Hat'], 2, 'A green hat.', 'listen-clothes')] },
    { subject: 'english', id: 'en-clothes2', grade: 2, title: 'Getting ready', unit: '8. What’s he wearing?', scene: 'wardrobe', emoji: '👕', subtitle: 'W co się ubrać?', body: 'It is cold outside. I am wearing a warm jumper, long trousers and a yellow scarf. My friend wears gloves.', translation: 'Na dworze jest zimno. Mam na sobie ciepły sweter, długie spodnie i żółty szalik. Mój przyjaciel nosi rękawiczki.', vocab: [{ en: 'jumper', pl: 'sweter' }, { en: 'trousers', pl: 'spodnie' }, { en: 'scarf', pl: 'szalik' }, { en: 'gloves', pl: 'rękawiczki' }], questions: [q('en-cl2-1', 'What is the weather like?', ['Cold', 'Hot', 'Sunny'], 0, 'It is cold outside.', 'listen-weather'), q('en-cl2-2', 'What colour is the scarf?', ['Green', 'Yellow', 'Orange'], 1, 'Yellow scarf.', 'listen-colours'), q('en-cl2-3', 'What does the friend wear?', ['A hat', 'A coat', 'Gloves'], 2, 'My friend wears gloves.', 'listen-clothes')] }
];
const polishStories = [
    { subject: 'polish', id: 'pl-list', grade: 2, title: 'List od babci', unit: 'Pisanie i rozumienie', scene: 'letter', emoji: '💌', subtitle: 'Dlaczego piszemy listy?', body: 'W poniedziałek Zosia znalazła w skrzynce niebieską kopertę. W środku był list od babci, która mieszkała w innej miejscowości. Babcia zaprosiła Zosię na sobotę do ogrodu. Dziewczynka od razu zaczęła planować, jakie kwiaty wspólnie zasadzą. Wieczorem napisała odpowiedź i poprosiła tatę o znaczek.', questions: [q('pl-l1', 'Od kogo Zosia dostała list?', ['Od babci', 'Od koleżanki', 'Od nauczycielki'], 0, 'Spójrz na drugie zdanie.', 'czytanie-fakty'), q('pl-l2', 'Kiedy Zosia miała odwiedzić ogród?', ['W niedzielę', 'W sobotę', 'W środę'], 1, 'Babcia podała dzień wizyty.', 'czytanie-fakty'), q('pl-l3', 'Dlaczego Zosia poprosiła tatę o znaczek?', ['Chciała zrobić rysunek', 'Chciała kupić kwiaty', 'Chciała wysłać odpowiedź'], 2, 'Znaczek jest potrzebny do wysłania listu.', 'czytanie-wnioski'), q('pl-l4', 'Co Zosia chciała robić z babcią?', ['Sadzić kwiaty', 'Budować karmnik', 'Piec bułki'], 0, 'Pomyśl o planie Zosi.', 'czytanie-fakty')] },
    { subject: 'polish', id: 'pl-miasto', grade: 2, title: 'Spacer po mieście', unit: 'Moja miejscowość', scene: 'town', emoji: '🏘️', subtitle: 'Ulice, miejsca i adresy', body: 'Olek wybrał się z mamą do biblioteki. Najpierw przeszli przez park, a potem skręcili w ulicę Słoneczną. Przy bibliotece zobaczyli znak przejścia dla pieszych. Olek przypomniał mamie, że trzeba zatrzymać się przed jezdnią i rozejrzeć w obie strony. W bibliotece wypożyczył książkę o kosmosie.', questions: [q('pl-m1', 'Dokąd szedł Olek?', ['Do sklepu', 'Do biblioteki', 'Na basen'], 1, 'To pierwsza informacja w opowiadaniu.', 'czytanie-fakty'), q('pl-m2', 'Przez co przeszli na początku?', ['Przez park', 'Przez most', 'Przez rynek'], 0, 'Spójrz na kolejność miejsc.', 'czytanie-kolejnosc'), q('pl-m3', 'Dlaczego trzeba się rozejrzeć przed jezdnią?', ['Żeby policzyć samochody', 'Żeby zobaczyć drzewa', 'Dla bezpieczeństwa'], 2, 'Ważne jest bezpieczne przejście.', 'czytanie-wnioski'), q('pl-m4', 'Jaki temat miała wypożyczona książka?', ['O zwierzętach', 'O kosmosie', 'O roślinach'], 1, 'Ostatnie zdanie zawiera odpowiedź.', 'czytanie-fakty')] },
    { subject: 'polish', id: 'pl-jesien', grade: 2, title: 'Jesienne odkrycie', unit: 'Przyroda jesienią', scene: 'forest', emoji: '🍁', subtitle: 'Czytanie i obserwacje', body: 'Kiedy nadeszła jesień, liście w parku stały się złote i czerwone. Lena znalazła pod kasztanowcem trzy błyszczące kasztany. Jeden oddała bratu, a dwa schowała do kieszeni. W domu ułożyła kasztany obok liści, aby przygotować małą wystawę przyrodniczą.', questions: [q('pl-j1', 'Jakie kolory miały liście?', ['Złote i czerwone', 'Niebieskie i zielone', 'Białe i czarne'], 0, 'Przeczytaj pierwsze zdanie.', 'czytanie-fakty'), q('pl-j2', 'Ile kasztanów Lena schowała do kieszeni?', ['Jeden', 'Dwa', 'Trzy'], 1, 'Znalazła trzy i oddała jeden.', 'czytanie-matematyka'), q('pl-j3', 'Po co Lena zabrała liście i kasztany?', ['Na obiad', 'Do sklepu', 'Na wystawę przyrodniczą'], 2, 'Przeczytaj ostatnie zdanie.', 'czytanie-wnioski'), q('pl-j4', 'Pod jakim drzewem znalazła kasztany?', ['Pod kasztanowcem', 'Pod sosną', 'Pod brzozą'], 0, 'Nazwa drzewa występuje w tekście.', 'czytanie-fakty')] },
    { subject: 'polish', id: 'pl-pomoc', grade: 2, title: 'Mała wielka pomoc', unit: 'Przyjaźń i współpraca', scene: 'school', emoji: '🤝', subtitle: 'Co oznacza współpraca?', body: 'W klasie Mai przygotowywano przedstawienie. Filip zapomniał kartki z tekstem swojej roli. Maja zauważyła, że jest zmartwiony, i zaproponowała wspólne ćwiczenie. Razem przeczytali jego kwestie trzy razy. Podczas występu Filip pamiętał cały tekst i podziękował Mai za wsparcie.', questions: [q('pl-p1', 'Dlaczego Filip był zmartwiony?', ['Zapomniał tekstu', 'Zgubił buty', 'Spóźnił się na autobus'], 0, 'Druga wypowiedź mówi o problemie.', 'czytanie-przyczyna'), q('pl-p2', 'Jak pomogła Maja?', ['Dała mu kwiaty', 'Ćwiczyła z nim tekst', 'Poszła do domu'], 1, 'Pomoc polegała na wspólnym czytaniu.', 'czytanie-fakty'), q('pl-p3', 'Ile razy ćwiczyli?', ['Raz', 'Dwa razy', 'Trzy razy'], 2, 'Liczba jest w tekście.', 'czytanie-fakty'), q('pl-p4', 'Czego uczy ta historia?', ['Współpracy', 'Samotności', 'Rywalizacji'], 0, 'Maja wsparła kolegę.', 'czytanie-wnioski')] },
    { subject: 'polish', id: 'pl-pies', grade: 2, title: 'Zaginiona smycz', unit: 'Opowiadanie', scene: 'garden', emoji: '🐕', subtitle: 'Zdarzenia po kolei', body: 'Po śniadaniu Antek przygotował psa Kropka do spaceru. Zauważył jednak, że smycz zniknęła z wieszaka. Najpierw zajrzał pod łóżko, później do przedpokoju. Smycz znalazł w koszyku z zabawkami. Okazało się, że młodsza siostra schowała ją tam podczas zabawy.', questions: [q('pl-d1', 'Jak miał na imię pies?', ['Reks', 'Kropek', 'Burek'], 1, 'Imię znajduje się w pierwszym zdaniu.', 'czytanie-fakty'), q('pl-d2', 'Gdzie Antek zajrzał najpierw?', ['Pod łóżko', 'Do ogrodu', 'Do szafy'], 0, 'Prześledź kolejność poszukiwań.', 'czytanie-kolejnosc'), q('pl-d3', 'Gdzie znalazł smycz?', ['W szufladzie', 'Pod stołem', 'W koszyku z zabawkami'], 2, 'Smycz była schowana w koszyku.', 'czytanie-fakty'), q('pl-d4', 'Kto schował smycz?', ['Tata', 'Młodsza siostra', 'Sąsiad'], 1, 'Ostatnie zdanie wyjaśnia zagadkę.', 'czytanie-przyczyna')] },
    { subject: 'polish', id: 'pl-ogrod', grade: 2, title: 'Tajemnica ogrodu', unit: 'Wiosenne zmiany', scene: 'garden', emoji: '🌷', subtitle: 'Czytanie ze zrozumieniem', body: 'W kwietniu Kuba zauważył małe zielone pędy obok płotu. Dziadek wyjaśnił mu, że jesienią posadzili tam cebulki tulipanów. Chłopiec postanowił podlewać rośliny, kiedy ziemia będzie sucha. Po kilku tygodniach w ogrodzie zakwitły czerwone i żółte kwiaty.', questions: [q('pl-o1', 'Kiedy Kuba zobaczył zielone pędy?', ['W styczniu', 'W kwietniu', 'W sierpniu'], 1, 'Przeczytaj pierwsze zdanie.', 'czytanie-fakty'), q('pl-o2', 'Co posadzono jesienią?', ['Cebulki tulipanów', 'Krzaki róż', 'Drzewa owocowe'], 0, 'Dziadek wyjaśnił, co rośnie.', 'czytanie-fakty'), q('pl-o3', 'Kiedy Kuba miał podlewać kwiaty?', ['Codziennie w nocy', 'Tylko zimą', 'Gdy ziemia będzie sucha'], 2, 'Warunek jest zapisany w trzecim zdaniu.', 'czytanie-wnioski'), q('pl-o4', 'Jakie kolory miały kwiaty?', ['Białe i różowe', 'Czerwone i żółte', 'Niebieskie i fioletowe'], 1, 'Kolory są pod koniec opowiadania.', 'czytanie-fakty')] },
    { subject: 'polish', id: 'pl-zima', grade: 2, title: 'Zimowy karmnik', unit: 'Zwierzęta zimą', scene: 'snow', emoji: '🐦', subtitle: 'Pomagamy ptakom', body: 'Kiedy spadł pierwszy śnieg, Marta i jej tata zawiesili karmnik na drzewie. Wsypali do niego ziarna słonecznika. Następnego ranka przyleciały sikorki. Marta obserwowała je przez okno, ale nie podchodziła zbyt blisko, aby ich nie przestraszyć.', questions: [q('pl-z1', 'Co Marta zrobiła z tatą?', ['Zbudowała bałwana', 'Zawiesiła karmnik', 'Zasadziła drzewo'], 1, 'Sprawdź, co zawiesili.', 'czytanie-fakty'), q('pl-z2', 'Czym napełnili karmnik?', ['Ziarnami słonecznika', 'Cukierkami', 'Chlebem'], 0, 'Znajdź drugie zdanie.', 'czytanie-fakty'), q('pl-z3', 'Jakie ptaki przyleciały?', ['Sowy', 'Bociany', 'Sikorki'], 2, 'W tekście podano nazwę gatunku.', 'czytanie-fakty'), q('pl-z4', 'Dlaczego Marta nie podchodziła blisko?', ['Bała się śniegu', 'Nie chciała przestraszyć ptaków', 'Nie miała butów'], 1, 'To ważny powód jej zachowania.', 'czytanie-wnioski')] },
